<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeTutor AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10121B;
    --panel: #171A26;
    --panel-2: #1E2233;
    --line: #2A2F45;
    --text: #E7E9F5;
    --muted: #8990AC;
    --accent: #55E6C1;
    --accent-dim: #2F8F79;
    --warn: #F5A96B;
    --user-bubble: #232842;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #F0685B; }
  .dot.y { background: #F5C15C; }
  .dot.g { background: var(--accent); }

  .topbar .path {
    margin-left: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .topbar .brand {
    margin-left: auto;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand .prompt-mark { color: var(--accent); }

  .hero {
    padding: 34px 22px 20px;
    border-bottom: 1px solid var(--line);
    background:
      radial-gradient(circle at 15% 0%, rgba(85,230,193,0.08), transparent 45%),
      var(--bg);
  }

  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    margin: 0 0 6px;
    font-weight: 700;
  }

  .hero h1 .cursor {
    display: inline-block;
    width: 9px;
    height: 22px;
    background: var(--accent);
    margin-left: 4px;
    vertical-align: middle;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .hero p {
    color: var(--muted);
    font-size: 13.5px;
    margin: 0;
    max-width: 560px;
    line-height: 1.55;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .chip {
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 11px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s, color 0.15s;
  }

  .chip:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .chat-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0 12px;
  }

  .chat-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .msg { display: flex; gap: 12px; align-items: flex-start; }

  .msg .tag {
    flex-shrink: 0;
    width: 66px;
    padding-top: 2px;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .msg.user .tag { color: var(--warn); }
  .msg.bot .tag { color: var(--accent); }

  .bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    max-width: 620px;
  }

  .msg.user .bubble { background: var(--user-bubble); }

  .bubble code, .bubble pre {
    font-family: 'JetBrains Mono', monospace;
    background: #0D0F18;
    border: 1px solid var(--line);
    border-radius: 5px;
  }

  .bubble pre {
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
  }

  .bubble code { padding: 1px 5px; font-size: 12.5px; }

  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .input-bar {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 14px 22px 18px;
  }

  .input-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 10px 10px 14px;
  }

  .input-inner .prompt-mark {
    color: var(--accent);
    font-weight: 600;
    padding-bottom: 9px;
  }

  textarea#msg-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    max-height: 140px;
    padding: 8px 0;
  }

  textarea#msg-input::placeholder { color: #565C79; }

  button#send-btn {
    background: var(--accent);
    color: #0B1512;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  button#send-btn:hover { opacity: 0.88; }
  button#send-btn:disabled { opacity: 0.4; cursor: default; }

  .hint {
    max-width: 760px;
    margin: 8px auto 0;
    color: #565C79;
    font-size: 11px;
    padding: 0 4px;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="dots">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    </div>
    <span class="path">~/codetutor-ai/session</span>
    <span class="brand"><span class="prompt-mark">&gt;_</span>CodeTutor AI</span>
  </div>

  <div class="hero">
    <h1>Stuck on some code<span class="cursor"></span></h1>
    <p>Paste your code, an error message, or ask a concept question. I'll explain it in plain terms, point out bugs, and suggest what to practice next.</p>
    <div class="chips">
      <button class="chip" data-fill="Explain what this code does:&#10;">Explain my code</button>
      <button class="chip" data-fill="I'm getting this error, help me fix it:&#10;">Fix an error</button>
      <button class="chip" data-fill="What is recursion? Explain with a simple example.">Concept question</button>
      <button class="chip" data-fill="Suggest a few beginner practice problems for Python loops.">Practice problems</button>
    </div>
  </div>

  <div class="chat-wrap" id="chat-wrap">
    <div class="chat-inner" id="chat-inner"></div>
  </div>

  <div class="input-bar">
    <div class="input-inner">
      <span class="prompt-mark">$</span>
      <textarea id="msg-input" rows="1" placeholder="Ask CodeTutor AI anything about code..."></textarea>
      <button id="send-btn">Send</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>

<script>
  const chatInner = document.getElementById('chat-inner');
  const chatWrap = document.getElementById('chat-wrap');
  const input = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function renderContent(text) {
    let escaped = escapeHtml(text);
    escaped = escaped.replace(/```([\s\S]*?)```/g, (m, code) => `<pre><code>${code.trim()}</code></pre>`);
    escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
    return escaped;
  }

  function addMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = role === 'user' ? 'you' : 'tutor';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderContent(text);

    msg.appendChild(tag);
    msg.appendChild(bubble);
    chatInner.appendChild(msg);
    chatWrap.scrollTop = chatWrap.scrollHeight;
    return bubble;
  }

  function addTypingIndicator() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing-msg';

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = 'tutor';

    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    msg.appendChild(tag);
    msg.appendChild(bubble);
    chatInner.appendChild(msg);
    chatWrap.scrollTop = chatWrap.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-msg');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    addTypingIndicator();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTypingIndicator();

      if (data.reply) {
        addMessage('bot', data.reply);
      } else {
        addMessage('bot', 'Something went wrong. Please try again.');
      }
    } catch (err) {
      removeTypingIndicator();
      addMessage('bot', 'Could not reach the server. Please check your connection.');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      input.value = chip.getAttribute('data-fill');
      input.focus();
      input.dispatchEvent(new Event('input'));
    });
  });

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch('/history');
      const data = await res.json();
      if (data.history && data.history.length) {
        data.history.forEach(m => addMessage(m.role === 'user' ? 'user' : 'bot', m.message));
      }
    } catch (err) {
      // no history yet, ignore
    }
  });
</script>

</body>
</html>
